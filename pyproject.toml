[project]
name = "django-boilerplate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "django==6.0.6",
    "django-environ==0.13.0",
    "django-filter==25.2",
    "django-split-settings==1.3.2",
    "djangorestframework==3.17.1",
    "drf-spectacular==0.29.0",
    "gunicorn==26.0.0",
    "psycopg[binary,pool]==3.3.4",
    "redis[hiredis]==8.0.0",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-django==4.12.0",
    "pytest-env==1.6.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.17",
    "ty==0.0.49",
]

[tool.ruff]
fix = false
line-length = 120

[tool.ruff.lint]
exclude = ["venv/*", ".venv/*", ".git", "*/migrations/*", "templates/*", "*__init__.py", "manage.py", "settings.py",]
ignore = ["PT009", "S101", "A003", "D100", "D104", "D105", "D106", "D107", "D203", "D205", "D212", "D4",]
select = [
    "PT", "E", "F", "UP", "B", "SIM", "I", "A", "COM", "C4", "G", "T20", "PT", "Q", "RET", "SIM", "W", "D", "BLE",
    "DJ", "RSE", "RUF100",
]
extend-fixable = ["I001", "I002", "COM812", "Q000", "D210", "D200"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[[tool.ty.overrides]]
exclude = [
    ".venv/**",
    "migrations/**",
    "tests/**",
]

[tool.bandit]
exclude_dirs = ['.venv', 'migrations', '__pycache__', 'tests']

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = 'config.settings'
python_files = ['test_*.py', '*_test.py']
# Значения по умолчанию для запуска тестов без .env (локально и в CI).
# Префикс D: — не перезаписывать уже установленные переменные окружения.
env = [
    'D:ENVIRONMENT=dev',
    'D:DJANGO_SECRET_KEY=insecure-test-secret-key',
    'D:DJANGO_DEBUG=True',
    'D:DJANGO_USE_LOCMEM_CACHE=True',
]
